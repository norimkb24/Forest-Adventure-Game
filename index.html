<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>森友大冒险 · Animal Friends Adventure</title>
<style>
/* ===== 森友大冒险 · Animal Crossing 风格 UI ===== */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
}

body {
  background:
    radial-gradient(900px 600px at 50% -10%, #2f5c46 0%, #1b3529 45%, #0e1a14 100%);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
  color: #58493a;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}

#app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; }

#stage {
  --s: 1;
  position: relative;
  width: min(100%, calc((100vh - 20px) * 960 / 560));
  aspect-ratio: 960 / 560;
  border-radius: calc(26px * var(--s));
  overflow: hidden;
  box-shadow:
    0 calc(22px * var(--s)) calc(50px * var(--s)) rgba(0,0,0,.55),
    0 0 0 calc(5px * var(--s)) #fdf3e3,
    0 0 0 calc(9px * var(--s)) #c9a978;
  background: #bfe9ff;
  isolation: isolate;
}

#stage canvas#game { display: block; width: 100%; height: 100%; }

/* ---------- 通用面板 ---------- */
.screen {
  position: absolute; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(120% 100% at 50% 0%, rgba(28,48,38,.30) 0%, rgba(12,26,20,.62) 100%);
  backdrop-filter: blur(calc(3px * var(--s)));
  animation: fadein .28s ease-out;
}
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.hidden { display: none !important; }

.panel {
  position: relative;
  background: linear-gradient(#fffdf7 0%, #fdf3e1 100%);
  border: calc(4px * var(--s)) solid #cba679;
  border-radius: calc(26px * var(--s));
  box-shadow:
    0 calc(12px * var(--s)) calc(28px * var(--s)) rgba(30,20,10,.35),
    inset 0 calc(-6px * var(--s)) 0 rgba(203,166,121,.22);
  padding: calc(20px * var(--s)) calc(24px * var(--s));
  text-align: center;
  animation: pop .34s cubic-bezier(.2,1.5,.5,1);
}
@keyframes pop { from { transform: scale(.86); opacity: .2 } to { transform: scale(1); opacity: 1 } }

.panel::before {
  content: ""; position: absolute; inset: calc(7px * var(--s));
  border: calc(2px * var(--s)) dashed rgba(203,166,121,.55);
  border-radius: calc(19px * var(--s));
  pointer-events: none;
}

.panel h1 {
  font-size: calc(30px * var(--s)); margin: 0; color: #5e4a34;
  letter-spacing: calc(1px * var(--s));
  text-shadow: 0 calc(2px * var(--s)) 0 #fff;
}
.panel h2 {
  font-size: calc(21px * var(--s)); margin: 0 0 calc(12px * var(--s)); color: #6b563d;
  letter-spacing: calc(1px * var(--s));
}
.panel .sub, .panel .hint {
  font-size: calc(11.5px * var(--s)); color: #a08f79; margin: calc(4px * var(--s)) 0 0; line-height: 1.6;
}

.start-panel { width: calc(560px * var(--s)); }
.small-panel { width: calc(390px * var(--s)); }
.small-panel .btn { width: 100%; margin-top: calc(9px * var(--s)); }

.logo { display: flex; align-items: center; justify-content: center; gap: calc(12px * var(--s)); margin-bottom: calc(14px * var(--s)); }
.logo .leaf-mark { font-size: calc(38px * var(--s)); filter: drop-shadow(0 calc(3px * var(--s)) 0 rgba(122,199,79,.5)); animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(10deg) } }
.logo h1 { text-align: left; }
.logo .sub { text-align: left; margin: 0; }

.field { text-align: left; margin-bottom: calc(12px * var(--s)); }
.field > label {
  display: block; font-size: calc(12.5px * var(--s)); font-weight: 700; color: #8a755a;
  margin-bottom: calc(7px * var(--s)); letter-spacing: calc(.5px * var(--s));
}

input[type="text"], #player-name {
  width: 100%; font: inherit;
  font-size: calc(15px * var(--s)); color: #5e4a34;
  padding: calc(9px * var(--s)) calc(14px * var(--s));
  border: calc(3px * var(--s)) solid #e2cda9;
  border-radius: calc(13px * var(--s));
  background: #fffdf8; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
#player-name:focus { border-color: #7ac74f; box-shadow: 0 0 0 calc(3px * var(--s)) rgba(122,199,79,.24); }
#player-name::placeholder { color: #c9b9a1; }

/* ---------- 形象选择 ---------- */
.avatars { display: flex; gap: calc(9px * var(--s)); flex-wrap: wrap; }
.avatar-btn {
  width: calc(66px * var(--s)); height: calc(70px * var(--s));
  border-radius: calc(16px * var(--s));
  border: calc(3px * var(--s)) solid #e2cda9;
  background: linear-gradient(#fffdf8, #f4ead6);
  cursor: pointer; padding: calc(3px * var(--s));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform .15s, border-color .15s, box-shadow .15s;
  position: relative;
}
.avatar-btn canvas { width: calc(44px * var(--s)); height: calc(44px * var(--s)); display: block; }
.avatar-btn span { font-size: calc(9.5px * var(--s)); color: #93816b; margin-top: calc(1px * var(--s)); font-weight: 700; }
.avatar-btn:hover { transform: translateY(calc(-2px * var(--s))); }
.avatar-btn.on { border-color: #7ac74f; box-shadow: 0 0 0 calc(3px * var(--s)) rgba(122,199,79,.28); background: linear-gradient(#f2ffe9, #e2f7d3); }
.avatar-btn.upload { border-style: dashed; color: #b09a7c; }
.avatar-btn.upload .plus { font-size: calc(22px * var(--s)); line-height: 1; }
.avatar-btn.upload.canvas-holder canvas { border-radius: 50%; }
/* 照片头像右上角的「更换」角标 */
.avatar-btn .edit-badge {
  position: absolute; right: calc(-5px * var(--s)); top: calc(-6px * var(--s));
  width: calc(20px * var(--s)); height: calc(20px * var(--s));
  border-radius: 50%; background: #7ac74f; color: #fff;
  border: calc(2px * var(--s)) solid #fff;
  font-size: calc(10px * var(--s)); font-style: normal; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 calc(2px * var(--s)) calc(4px * var(--s)) rgba(60,100,30,.35);
  cursor: pointer; z-index: 2;
}
.avatar-btn .edit-badge:active { transform: scale(.9); }

/* ---------- 关卡选择 ---------- */
.levels { display: flex; gap: calc(7px * var(--s)); flex-wrap: wrap; }
.lv {
  width: calc(46px * var(--s)); height: calc(40px * var(--s));
  border-radius: calc(12px * var(--s));
  border: calc(3px * var(--s)) solid #e2cda9;
  background: linear-gradient(#fffdf8, #f4ead6);
  font: inherit; font-size: calc(14px * var(--s)); font-weight: 800; color: #8a755a;
  cursor: pointer; transition: transform .15s, border-color .15s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.05;
}
.lv small { font-size: calc(7.5px * var(--s)); font-weight: 600; color: #b6a48c; }
.lv:hover:not(.locked) { transform: translateY(calc(-2px * var(--s))); border-color: #c9a978; }
.lv.on { border-color: #7ac74f; background: linear-gradient(#f2ffe9, #dff5cd); color: #4d8a30; }
.lv.locked { opacity: .5; cursor: not-allowed; color: #b6a48c; }
.lv.done { border-color: #ffc94d; background: linear-gradient(#fffbe9, #fff0c2); }

/* ---------- 按钮 ---------- */
.btn {
  font: inherit; font-weight: 800; cursor: pointer;
  font-size: calc(14px * var(--s));
  padding: calc(10px * var(--s)) calc(20px * var(--s));
  border-radius: calc(15px * var(--s));
  border: none; transition: transform .12s, filter .12s, box-shadow .12s;
  letter-spacing: calc(.5px * var(--s));
  display: inline-flex; align-items: center; justify-content: center; gap: calc(6px * var(--s));
}
.btn.primary {
  background: linear-gradient(#8fd96a 0%, #63b83c 100%);
  color: #fff; text-shadow: 0 calc(1.5px * var(--s)) 0 rgba(50,110,20,.5);
  box-shadow: 0 calc(4px * var(--s)) 0 #4d9429, 0 calc(7px * var(--s)) calc(12px * var(--s)) rgba(77,148,41,.35);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:active { transform: translateY(calc(4px * var(--s))); box-shadow: 0 0 0 #4d9429; }
.btn.ghost {
  background: linear-gradient(#fffdf8, #f2e7d3); color: #8a755a;
  box-shadow: 0 calc(4px * var(--s)) 0 #d8c3a0;
}
.btn.ghost:active { transform: translateY(calc(4px * var(--s))); box-shadow: 0 0 0 #d8c3a0; }
.btn.big { width: 100%; margin-top: calc(4px * var(--s)); padding: calc(13px * var(--s)); font-size: calc(17px * var(--s)); }
.btn.tiny { font-size: calc(11.5px * var(--s)); padding: calc(7px * var(--s)) calc(12px * var(--s)); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.row { display: flex; gap: calc(9px * var(--s)); justify-content: center; }
.row .btn { flex: 1; }
.sound-row { margin-top: calc(14px * var(--s)); padding-top: calc(12px * var(--s)); border-top: calc(2px * var(--s)) dashed rgba(203,166,121,.5); }

/* ---------- 裁剪 ---------- */
.crop-panel { width: calc(420px * var(--s)); }
.crop-wrap { position: relative; width: calc(320px * var(--s)); height: calc(320px * var(--s)); margin: calc(8px * var(--s)) auto calc(12px * var(--s)); border-radius: calc(18px * var(--s)); overflow: hidden; background: #2b2118; box-shadow: inset 0 0 calc(22px * var(--s)) rgba(0,0,0,.6); }
.crop-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.crop-wrap canvas:active { cursor: grabbing; }
.crop-ring {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 0 calc(42% - 2px), rgba(15,10,5,.62) calc(42% - 1px) 100%);
  box-shadow: inset 0 0 0 calc(3px * var(--s)) rgba(255,255,255,.85);
}
.crop-ctrl { display: flex; align-items: center; gap: calc(11px * var(--s)); margin-bottom: calc(13px * var(--s)); font-size: calc(12.5px * var(--s)); color: #8a755a; font-weight: 700; }
.crop-ctrl input[type=range] { flex: 1; accent-color: #7ac74f; }

/* ---------- 统计 ---------- */
.stats { display: flex; justify-content: center; gap: calc(8px * var(--s)); margin: calc(14px * var(--s)) 0 calc(4px * var(--s)); flex-wrap: wrap; }
.stat {
  background: linear-gradient(#fffdf8, #f5ebd8);
  border: calc(3px * var(--s)) solid #e6d5b6;
  border-radius: calc(14px * var(--s));
  padding: calc(8px * var(--s)) calc(13px * var(--s));
  min-width: calc(84px * var(--s));
}
.stat .v { font-size: calc(19px * var(--s)); font-weight: 900; color: #4d8a30; }
.stat .k { font-size: calc(10.5px * var(--s)); color: #a08f79; font-weight: 700; }
.clear-badge { font-size: calc(46px * var(--s)); line-height: 1; margin-bottom: calc(6px * var(--s)); animation: pop .5s cubic-bezier(.2,1.6,.5,1); }

/* ---------- 通关庆祝 ---------- */
.congrats-panel { width: calc(600px * var(--s)); overflow: hidden; }
.trophy { font-size: calc(58px * var(--s)); line-height: 1; animation: float 2s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(calc(-9px * var(--s))) rotate(3deg) } }
.congrats-title {
  font-size: calc(38px * var(--s)) !important;
  color: #ef8c2c;
  letter-spacing: calc(1.5px * var(--s));
  text-shadow:
    0 calc(2px * var(--s)) 0 #fffdf5,
    0 calc(5px * var(--s)) calc(9px * var(--s)) rgba(180, 90, 20, .3);
  margin: calc(4px * var(--s)) 0 calc(6px * var(--s)) !important;
  animation: shine 2.4s ease-in-out infinite;
}
@keyframes shine { 0%,100% { transform: scale(1) } 50% { transform: scale(1.035) } }
.congrats-sub { font-size: calc(14px * var(--s)); color: #8a755a; margin: 0 0 calc(10px * var(--s)); }
.congrats-sub b { color: #e07a2c; font-size: calc(16px * var(--s)); }
.congrats-avatar { display: flex; justify-content: center; margin-bottom: calc(4px * var(--s)); }
.congrats-avatar canvas { width: calc(96px * var(--s)); height: calc(96px * var(--s)); border-radius: 50%; box-shadow: 0 0 0 calc(4px * var(--s)) #fff, 0 0 0 calc(7px * var(--s)) #7ac74f, 0 calc(8px * var(--s)) calc(16px * var(--s)) rgba(0,0,0,.25); animation: float 2.6s ease-in-out infinite; }
.congrats-quote { font-size: calc(12.5px * var(--s)); color: #a08f79; font-style: italic; margin: calc(10px * var(--s)) 0 calc(14px * var(--s)); line-height: 1.7; }

/* 彩带 */
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i {
  position: absolute; top: -6%; border-radius: 2px;
  animation: fall linear infinite;
  opacity: .95;
}
@keyframes fall {
  0%   { transform: translateY(-10vh) rotate(0deg) scale(1); }
  100% { transform: translateY(115vh) rotate(760deg) scale(1); }
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 30; pointer-events: none; padding: calc(10px * var(--s)); }
.hud-row { display: flex; align-items: flex-start; gap: calc(9px * var(--s)); }

.hud-card {
  background: rgba(255, 252, 243, .93);
  border: calc(3px * var(--s)) solid #cba679;
  border-radius: calc(18px * var(--s));
  box-shadow: 0 calc(5px * var(--s)) calc(12px * var(--s)) rgba(40,30,15,.25);
  padding: calc(7px * var(--s)) calc(11px * var(--s));
  pointer-events: auto;
}
.hud-left { display: flex; align-items: center; gap: calc(9px * var(--s)); }
#hud-avatar { width: calc(42px * var(--s)); height: calc(42px * var(--s)); border-radius: 50%; background: #f2e7d3; box-shadow: 0 0 0 calc(2.5px * var(--s)) #fff, 0 0 0 calc(4px * var(--s)) #7ac74f; }
.hud-left .pname { font-size: calc(14px * var(--s)); font-weight: 900; color: #5e4a34; max-width: calc(120px * var(--s)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts { font-size: calc(13px * var(--s)); letter-spacing: calc(1px * var(--s)); line-height: 1.25; height: calc(17px * var(--s)); }
.hearts .off { opacity: .22; filter: grayscale(1); }

.hud-center { flex: 1; }
.lvl-line { display: flex; align-items: center; gap: calc(6px * var(--s)); font-size: calc(11.5px * var(--s)); font-weight: 800; color: #8a755a; margin-bottom: calc(5px * var(--s)); }
.lvl-line .dot { color: #d3c0a3; }
.lvl-line .pct { margin-left: auto; color: #4d8a30; font-size: calc(13px * var(--s)); }
.bar {
  position: relative; height: calc(15px * var(--s));
  background: #e8dcc7; border-radius: calc(9px * var(--s));
  box-shadow: inset 0 calc(2px * var(--s)) calc(4px * var(--s)) rgba(120,100,70,.3);
  overflow: visible;
}
.bar-fill {
  height: 100%; width: 0%;
  border-radius: calc(9px * var(--s));
  background: linear-gradient(90deg, #a8e063 0%, #7ac74f 45%, #ffd75e 100%);
  box-shadow: inset 0 calc(-3px * var(--s)) 0 rgba(70,140,30,.32);
  transition: width .12s linear;
  position: relative; overflow: hidden;
}
.bar-fill::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, rgba(255,255,255,.34) 0 calc(7px * var(--s)), transparent calc(7px * var(--s)) calc(15px * var(--s)));
  animation: slide 1s linear infinite;
}
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(calc(15px * var(--s))) } }
.bar-icon {
  position: absolute; top: 50%; left: 0;
  transform: translate(-50%, -54%);
  font-size: calc(17px * var(--s)); transition: left .12s linear;
  filter: drop-shadow(0 calc(2px * var(--s)) calc(2px * var(--s)) rgba(0,0,0,.28));
}
.leaves { display: flex; gap: calc(3px * var(--s)); margin-top: calc(5px * var(--s)); }
.leaves i { font-size: calc(11px * var(--s)); opacity: .26; filter: grayscale(1); font-style: normal; }
.leaves i.on { opacity: 1; filter: none; }

.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: calc(6px * var(--s)); }
.counter { font-size: calc(13px * var(--s)); font-weight: 900; color: #b8862b; display: flex; align-items: center; gap: calc(4px * var(--s)); }
.counter .bell { font-size: calc(14px * var(--s)); }
.icon-row { display: flex; gap: calc(5px * var(--s)); }
.icon-btn {
  font-size: calc(14px * var(--s)); cursor: pointer;
  width: calc(29px * var(--s)); height: calc(29px * var(--s));
  border-radius: 50%; border: calc(2.5px * var(--s)) solid #e2cda9;
  background: linear-gradient(#fffdf8, #f2e7d3);
  display: flex; align-items: center; justify-content: center;
  padding: 0; line-height: 1;
}
.icon-btn:active { transform: scale(.92); }

/* ---------- 枪铺按钮 ---------- */
.icon-btn.shop { position: relative; opacity: .5; filter: grayscale(.55); }
.icon-btn.shop.ready {
  opacity: 1; filter: none;
  border-color: #ffc94d;
  box-shadow: 0 0 0 calc(2px * var(--s)) rgba(255,201,77,.35);
  animation: shopPulse 1.6s ease-in-out infinite;
}
.icon-btn.shop.on {
  opacity: 1; filter: none;
  background: linear-gradient(#eaffd9, #c8efb0);
  border-color: #7ac74f;
  box-shadow: 0 0 0 calc(2px * var(--s)) rgba(122,199,79,.35);
}
.icon-btn.shop.on .cost { display: none; }
.icon-btn.shop .cost {
  position: absolute; right: calc(-4px * var(--s)); bottom: calc(-4px * var(--s));
  font-size: calc(8px * var(--s)); font-weight: 900; font-style: normal;
  background: #ffc94d; color: #7a5310;
  border-radius: calc(7px * var(--s)); padding: 0 calc(3px * var(--s));
  line-height: calc(11px * var(--s)); border: calc(1.5px * var(--s)) solid #fff;
}
@keyframes shopPulse {
  0%, 100% { box-shadow: 0 0 0 calc(2px * var(--s)) rgba(255,201,77,.28); }
  50% { box-shadow: 0 0 0 calc(5px * var(--s)) rgba(255,201,77,.10); }
}

/* ---------- 提示条 ---------- */
.toast {
  position: absolute; left: 50%; top: calc(96px * var(--s));
  transform: translateX(-50%);
  z-index: 45; pointer-events: none;
  background: rgba(255,252,243,.96);
  border: calc(3px * var(--s)) solid #cba679;
  border-radius: calc(15px * var(--s));
  padding: calc(8px * var(--s)) calc(18px * var(--s));
  font-size: calc(13px * var(--s)); font-weight: 800; color: #5e4a34;
  box-shadow: 0 calc(7px * var(--s)) calc(16px * var(--s)) rgba(30,20,10,.28);
  white-space: nowrap;
  animation: toastIn .22s cubic-bezier(.2,1.5,.5,1);
}
.toast.good { background: linear-gradient(#f4ffe9, #e2f7cf); border-color: #7ac74f; color: #3f7a24; }
.toast.bad { background: linear-gradient(#fff2f2, #ffe2e2); border-color: #e59a9a; color: #a34a4a; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, calc(-10px * var(--s))) } to { opacity: 1; transform: translate(-50%, 0) } }

/* ---------- 关卡横幅 ---------- */
.banner { position: absolute; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.banner-inner {
  background: rgba(255,252,243,.96);
  border: calc(4px * var(--s)) solid #cba679;
  border-radius: calc(24px * var(--s));
  padding: calc(18px * var(--s)) calc(44px * var(--s));
  text-align: center;
  box-shadow: 0 calc(12px * var(--s)) calc(26px * var(--s)) rgba(30,20,10,.32);
  animation: bannerIn .5s cubic-bezier(.2,1.5,.45,1);
}
@keyframes bannerIn { from { transform: scale(.7) translateY(calc(20px * var(--s))); opacity: 0 } to { transform: none; opacity: 1 } }
.banner-tag { font-size: calc(11.5px * var(--s)); font-weight: 900; color: #fff; background: #7ac74f; display: inline-block; padding: calc(3px * var(--s)) calc(12px * var(--s)); border-radius: calc(20px * var(--s)); letter-spacing: calc(2px * var(--s)); }
.banner-name { font-size: calc(30px * var(--s)); font-weight: 900; color: #5e4a34; margin: calc(9px * var(--s)) 0 calc(4px * var(--s)); }
.banner-sub { font-size: calc(13px * var(--s)); color: #a08f79; }

/* ---------- 触屏 ---------- */
#touch { position: absolute; inset: 0; z-index: 36; pointer-events: none; }
.tpad { position: absolute; bottom: calc(16px * var(--s)); left: calc(16px * var(--s)); display: flex; gap: calc(12px * var(--s)); }
.tpad.right { left: auto; right: calc(16px * var(--s)); }
.tbtn {
  pointer-events: auto;
  width: calc(62px * var(--s)); height: calc(62px * var(--s));
  border-radius: 50%;
  border: calc(3px * var(--s)) solid rgba(255,255,255,.75);
  background: rgba(255,252,243,.55);
  color: #5e4a34; font: inherit; font-size: calc(20px * var(--s)); font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(calc(4px * var(--s)));

}
.tbtn:active { background: rgba(122,199,79,.7); transform: scale(.94); }
.tbtn.jump { background: rgba(255,215,94,.58); width: calc(72px * var(--s)); height: calc(72px * var(--s)); }

@media (max-width: 700px) {

}

</style>
</head>

<script>
/* =========================================================
   audio.js  —  森友大冒险 音乐 / 音效引擎
   - 程序化生成的 Relaxing BGM（雨声感铺底 + 柔和钢琴感旋律）
   - 支持载入用户自己的音频文件作为 BGM
   ========================================================= */
(function () {
  const AC = (window.AC = window.AC || {});

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------------- 混响 IR ---------------- */
  function makeIR(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  /* ---------------- 音乐引擎 ---------------- */
  // 相对 F 大调的旋律音级：0=F 2=G 4=A 5=Bb 7=C 9=D 12=F 14=G 16=A
  const MELODY = [
    // [小节, 拍位, 音级, 时值]
    [0, 0, 12, 1.0], [0, 1, 9, 0.5], [0, 1.5, 7, 0.5], [0, 2.5, 9, 1.5],
    [1, 0, 5, 1.0], [1, 1, 7, 0.5], [1, 1.5, 9, 0.5], [1, 2.5, 7, 1.5],
    [2, 0, 4, 1.0], [2, 1, 7, 0.5], [2, 1.5, 5, 0.5], [2, 2.5, 4, 1.5],
    [3, 0, 2, 1.0], [3, 1.5, 4, 0.5], [3, 2.5, 0, 1.5],
    [4, 0, 12, 1.5], [4, 2, 14, 0.5], [4, 2.5, 12, 1.5],
    [5, 0, 9, 1.0], [5, 1.5, 12, 1.0], [5, 3, 9, 1.0],
    [6, 0, 7, 1.0], [6, 1, 5, 0.5], [6, 1.5, 4, 0.5], [6, 2.5, 2, 1.5],
    [7, 0, 0, 1.5], [7, 2, 4, 2.0],
  ];
  // 每个小节的和弦（根音 midi + 和弦音相对根音的半音数）
  const CHORDS = [
    { root: 53, iv: [0, 4, 7, 11] },  // Fmaj7
    { root: 50, iv: [0, 3, 7, 10] },  // Dm7
    { root: 46, iv: [0, 4, 7, 11] },  // Bbmaj7
    { root: 48, iv: [0, 5, 7, 12] },  // Csus
  ];
  const BARS = 8;
  const BPM = 74;
  const SPB = 60 / BPM;          // 每拍秒数
  const STEP = SPB / 2;          // 八分音符

  class Music {
    constructor() {
      this.ready = false;
      this.playing = false;
      this.muted = false;
      this.keyOffset = 0;        // 每关移调
      this.step = 0;
      this.nextTime = 0;
      this.timer = null;
      this.customEl = null;      // 用户自己的 BGM
      this.customMode = false;
      this.volume = 0.62;
    }

    init() {
      if (this.ready) return;
      const ACtx = window.AudioContext || window.webkitAudioContext;
      if (!ACtx) return;
      const ctx = (this.ctx = new ACtx());

      // 母总线
      this.master = ctx.createGain();
      this.master.gain.value = this.muted ? 0 : this.volume;

      // 柔和限幅
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 24;
      comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.28;

      this.master.connect(comp);
      comp.connect(ctx.destination);

      // 混响
      this.rev = ctx.createConvolver();
      this.rev.buffer = makeIR(ctx, 2.4, 2.6);
      this.revGain = ctx.createGain();
      this.revGain.gain.value = 0.42;
      this.rev.connect(this.revGain);
      this.revGain.connect(this.master);

      // 音乐总线
      this.musicBus = ctx.createGain();
      this.musicBus.gain.value = 0.9;
      this.musicBus.connect(this.master);

      this.dryGain = ctx.createGain();
      this.dryGain.gain.value = 1;
      this.dryGain.connect(this.musicBus);

      // 延迟（让旋律更有空间感）
      this.delay = ctx.createDelay(1.2);
      this.delay.delayTime.value = SPB * 0.75;
      this.delayGain = ctx.createGain();
      this.delayGain.gain.value = 0.26;
      const dFb = ctx.createGain(); dFb.gain.value = 0.32;
      const dLP = ctx.createBiquadFilter(); dLP.type = 'lowpass'; dLP.frequency.value = 1800;
      this.delay.connect(dLP); dLP.connect(dFb); dFb.connect(this.delay);
      this.delay.connect(this.musicBus);
      this.delayIn = ctx.createGain();
      this.delayIn.connect(this.delay);

      // 音效总线
      this.sfxBus = ctx.createGain();
      this.sfxBus.gain.value = 0.9;
      this.sfxBus.connect(this.master);

      this.ready = true;
    }

    resume() {
      if (!this.ready) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }

    /* ---- 单音 ---- */
    tone(opts) {
      const ctx = this.ctx; if (!ctx) return;
      const t = opts.t || ctx.currentTime;
      const dur = opts.dur || 0.5;
      const o = ctx.createOscillator();
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(opts.freq, t);
      if (opts.freqTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.freqTo), t + dur);

      const g = ctx.createGain();
      const peak = opts.gain == null ? 0.2 : opts.gain;
      const atk = opts.atk == null ? 0.012 : opts.atk;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      let node = o;
      if (opts.filter) {
        const f = ctx.createBiquadFilter();
        f.type = opts.filter; f.frequency.value = opts.cutoff || 1200; f.Q.value = opts.q || 0.7;
        node.connect(f); node = f;
      }
      node.connect(g);

      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (p) { p.pan.value = opts.pan || 0; g.connect(p); p.connect(opts.out || this.dryGain); }
      else g.connect(opts.out || this.dryGain);

      if (opts.rev) {
        const rg = ctx.createGain(); rg.gain.value = opts.rev;
        g.connect(rg); rg.connect(this.rev);
      }
      if (opts.delay) {
        const dg = ctx.createGain(); dg.gain.value = opts.delay;
        g.connect(dg); dg.connect(this.delayIn);
      }

      o.start(t);
      o.stop(t + dur + 0.06);
      return o;
    }

    /* ---- 噪声（沙锤 / 踩地） ---- */
    noise(opts) {
      const ctx = this.ctx; if (!ctx) return;
      const t = opts.t || ctx.currentTime;
      const dur = opts.dur || 0.06;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, opts.decay || 3);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = opts.filter || 'highpass'; f.frequency.value = opts.cutoff || 5000;
      const g = ctx.createGain(); g.gain.value = opts.gain == null ? 0.05 : opts.gain;
      src.connect(f); f.connect(g);
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (p) { p.pan.value = opts.pan || 0; g.connect(p); p.connect(opts.out || this.musicBus); }
      else g.connect(opts.out || this.musicBus);
      src.start(t); src.stop(t + dur + 0.02);
    }

    /* ---- 和弦 Pad ---- */
    chord(barIdx, t) {
      const c = CHORDS[barIdx % CHORDS.length];
      const root = c.root + this.keyOffset;
      for (let i = 0; i < c.iv.length; i++) {
        const f = mtof(root + c.iv[i] + 12);
        this.tone({
          t, freq: f, dur: SPB * 4.2, type: 'triangle',
          gain: 0.052, atk: 1.1, filter: 'lowpass', cutoff: 1450,
          pan: (i - 1.5) * 0.28, rev: 0.55, out: this.dryGain,
        });
      }
      // 低音
      this.tone({ t, freq: mtof(root - 12), dur: SPB * 2.0, type: 'sine', gain: 0.19, atk: 0.03, rev: 0.12 });
      this.tone({ t: t + SPB * 2, freq: mtof(root - 12), dur: SPB * 2.0, type: 'sine', gain: 0.15, atk: 0.03, rev: 0.12 });
    }

    /* ---- 铃声点缀 ---- */
    bellNote(f, t, gain) {
      this.tone({ t, freq: f, dur: 1.6, type: 'sine', gain: gain || 0.075, atk: 0.005, rev: 0.5, delay: 0.18 });
      this.tone({ t, freq: f * 2.01, dur: 0.9, type: 'sine', gain: (gain || 0.075) * 0.3, atk: 0.005, rev: 0.4 });
    }

    /* ---- 单步调度 ---- */
    scheduleStep(step, t) {
      const bar = Math.floor(step / 8) % BARS;
      const beat = (step % 8) / 2;

      if (step % 8 === 0) this.chord(bar, t);

      // 沙锤
      const sh = step % 2 === 0 ? 0.026 : 0.015;
      this.noise({ t, dur: 0.055, cutoff: 7200, gain: sh, pan: step % 4 < 2 ? -0.3 : 0.3, decay: 4 });

      // 轻踏
      if (beat === 0 || beat === 2) {
        this.tone({ t, freq: 92, freqTo: 52, dur: 0.22, type: 'sine', gain: 0.14, atk: 0.004 });
      }

      // 旋律
      for (let i = 0; i < MELODY.length; i++) {
        const m = MELODY[i];
        if (m[0] !== bar || Math.abs(m[1] - beat) > 0.001) continue;
        const root = 53 + this.keyOffset;
        this.tone({
          t, freq: mtof(root + m[2]), dur: Math.max(0.34, m[3] * SPB * 1.7),
          type: 'triangle', gain: 0.115, atk: 0.02,
          filter: 'lowpass', cutoff: 2600,
          pan: 0.1, rev: 0.42, delay: 0.34,
        });
      }

      // 铃铛点缀（每两小节一次）
      if (step === 14 || step === 46) {
        const root = 53 + this.keyOffset;
        this.bellNote(mtof(root + 24), t, 0.055);
      }
    }

    loop() {
      if (!this.playing || !this.ctx) return;
      const horizon = this.ctx.currentTime + 0.25;
      let guard = 0;
      while (this.nextTime < horizon && guard++ < 64) {
        this.scheduleStep(this.step, this.nextTime);
        this.step = (this.step + 1) % (BARS * 8);
        this.nextTime += STEP;
      }
    }

    start() {
      this.resume();
      if (!this.ready) return;
      if (this.customMode) { this.playCustom(); return; }
      if (this.playing) return;
      this.playing = true;
      this.step = 0;
      this.nextTime = this.ctx.currentTime + 0.12;
      clearInterval(this.timer);
      this.timer = setInterval(() => this.loop(), 25);
    }

    stop() {
      this.playing = false;
      clearInterval(this.timer);
      this.timer = null;
      if (this.customMode) this.pauseCustom();
      const t = this.ctx ? this.ctx.currentTime : 0;
      if (this.musicBus && this.ctx) {
        this.musicBus.gain.cancelScheduledValues(t);
        this.musicBus.gain.setTargetAtTime(0.0001, t, 0.12);
        setTimeout(() => {
          if (this.musicBus) this.musicBus.gain.setValueAtTime(0.9, this.ctx.currentTime);
        }, 700);
      }
    }

    /* ---- 用户自定义 BGM ---- */
    setCustomFile(file) {
      if (this.customEl) { this.customEl.pause(); this.customEl = null; }
      const url = URL.createObjectURL(file);
      const el = new Audio(url);
      el.loop = true;
      el.volume = 0.55;
      this.customEl = el;
      this.customMode = true;
      this.customName = file.name;
      if (this.playing) this.stop();
      el.play().catch(() => {});
      return el;
    }
    clearCustom() {
      if (this.customEl) { this.customEl.pause(); this.customEl = null; }
      this.customMode = false;
      this.customName = null;
    }
    playCustom() {
      if (this.customEl && this.customEl.paused) this.customEl.play().catch(() => {});
    }
    pauseCustom() { if (this.customEl) this.customEl.pause(); }

    /* ---- 静音 ---- */
    setMuted(m) {
      this.muted = m;
      if (this.master && this.ctx) this.master.gain.setTargetAtTime(m ? 0 : this.volume, this.ctx.currentTime, 0.05);
      if (this.customEl) this.customEl.volume = m ? 0 : 0.55;
    }
    toggleMute() { this.setMuted(!this.muted); return this.muted; }

    setLevel(i) { this.keyOffset = [0, 2, -2, 3, -4, 5][i % 6]; }

    /* ---------------- 音效 ---------------- */
    sfx(name) {
      if (!this.ready) return;
      this.resume();
      const t = this.ctx.currentTime + 0.001;
      const o = (extra) => Object.assign({ t, out: this.sfxBus, rev: 0.16 }, extra);
      switch (name) {
        case 'jump':
          this.tone(o({ freq: 430, freqTo: 780, dur: 0.16, type: 'triangle', gain: 0.16 }));
          break;
        case 'land':
          this.noise({ t, dur: 0.09, cutoff: 1400, filter: 'lowpass', gain: 0.09, out: this.sfxBus, decay: 5 });
          break;
        case 'bell':
          this.tone(o({ freq: mtof(88), dur: 0.5, type: 'sine', gain: 0.17 }));
          this.tone(o({ t: t + 0.055, freq: mtof(95), dur: 0.5, type: 'sine', gain: 0.14 }));
          break;
        case 'fruit':
          [76, 81, 88].forEach((n, i) => this.tone(o({ t: t + i * 0.055, freq: mtof(n), dur: 0.45, type: 'triangle', gain: 0.15 })));
          break;
        case 'hurt':
          this.tone(o({ freq: 420, freqTo: 110, dur: 0.42, type: 'sawtooth', gain: 0.13, filter: 'lowpass', cutoff: 900 }));
          break;
        case 'stomp':
          this.tone(o({ freq: 300, freqTo: 660, dur: 0.14, type: 'square', gain: 0.1, filter: 'lowpass', cutoff: 1400 }));
          break;
        case 'check':
          [72, 76, 79].forEach((n, i) => this.tone(o({ t: t + i * 0.07, freq: mtof(n), dur: 0.5, type: 'sine', gain: 0.14 })));
          break;
        case 'goal':
          [72, 76, 79, 84, 88].forEach((n, i) => this.tone(o({ t: t + i * 0.1, freq: mtof(n), dur: 0.9, type: 'triangle', gain: 0.17, rev: 0.4 })));
          break;
        case 'ui':
          this.tone(o({ freq: 720, dur: 0.1, type: 'sine', gain: 0.1 }));
          break;
        case 'shoot':
          this.noise({ t, dur: 0.07, cutoff: 2600, filter: 'highpass', gain: 0.075, out: this.sfxBus, decay: 7 });

          break;
        case 'buy':
          [79, 84, 88].forEach((n, i) => this.tone(o({ t: t + i * 0.06, freq: mtof(n), dur: 0.35, type: 'triangle', gain: 0.14 })));
          break;
        case 'win':
          [65, 69, 72, 77, 81, 84, 89, 93].forEach((n, i) =>
            this.tone(o({ t: t + i * 0.13, freq: mtof(n), dur: 1.6, type: 'triangle', gain: 0.17, rev: 0.55 })));

<script>
/* =========================================================
   levels.js  —  6 个关卡的生成与数据
   tile = 40px, 逻辑画布 960 x 560 (14 行)
   规则：必须通行的只有地面与 <=3 格的坑；浮空平台都是"拿铃钱"的可选路线
   ========================================================= */
(function () {
  const AC = (window.AC = window.AC || {});
  const T = 40;

  /* ---------------- 随机数 ---------------- */
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }
  const ri = (R, a, b) => a + Math.floor(R() * (b - a + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---------------- 构造原语 ---------------- */
  const solid = (c, r, w, h, oneWay) => ({ x: c * T, y: r * T, w: w * T, h: h * T, oneWay: !!oneWay });
  const ground = (a, b, r) => solid(a, r, b - a + 1, 14 - r, false);
  const plat = (c, r, w) => solid(c, r, w, 0.46, true);
  const ledge = (c, r) => solid(c, r, 1, 1, false);
  const mover = (c, r, w, axis, range, speed) => ({
    x: c * T, y: r * T, w: w * T, h: 0.46 * T, oneWay: true, mover: true,
    axis: axis, range: range * T, speed: speed, baseX: c * T, baseY: r * T,
    phase: 0, dx: 0, dy: 0,
  });
  const bell = (c, r) => ({ type: 'bell', x: c * T + T / 2, y: r * T + T / 2, got: false, t: Math.random() * 6 });
  const fruit = (c, r) => ({ type: 'fruit', x: c * T + T / 2, y: r * T + T / 2, got: false, t: Math.random() * 6 });
  const walker = (c, r, a, b) => ({
    type: 'walker', x: c * T, y: r * T - 30, w: 32, h: 30,
    minX: a * T, maxX: b * T, vx: 62, dir: 1, dead: 0, t: Math.random() * 6, squash: 0,
  });
  const flyer = (c, r, a, b, amp, speed) => ({
    type: 'flyer', x: c * T, y: r * T, baseY: r * T, w: 30, h: 26,
    minX: a * T, maxX: b * T, vx: 92 * speed, dir: 1, amp: amp * T, ph: Math.random() * 6,
    dead: 0, t: Math.random() * 6,
  });

  /* ---------------- 关卡元信息 ---------------- */
  const META = [
    { id: 1, name: '春 · 青青草原', short: '草原', theme: 0, cols: 112, diff: 1, seed: 20260301,
      hint: '向右前进，收集铃钱，抵达终点风车！' },
    { id: 2, name: '夏 · 海滨沙丘', short: '海滩', theme: 1, cols: 124, diff: 2, seed: 771103,
      hint: '小心的蝴蝶，跳过沙滩上的裂缝。' },
    { id: 3, name: '秋 · 枫叶林', short: '枫林', theme: 2, cols: 132, diff: 3, seed: 390217,
      hint: '会漂浮的木板出现了，踩稳再跳。' },
    { id: 4, name: '冬 · 雪之谷', short: '雪谷', theme: 3, cols: 140, diff: 4, seed: 55120,
      hint: '上下浮动的平台，注意起跳节奏。' },
    { id: 5, name: '黄昏 · 樱花丘', short: '樱丘', theme: 4, cols: 148, diff: 5, seed: 880143,
      hint: '长距离跳跃，记得先助跑。' },
    { id: 6, name: '星夜 · 云端镇', short: '云镇', theme: 5, cols: 156, diff: 6, seed: 204617,
      hint: '最终关卡，稳住心态，终点就在前方！' },
  ];

  /* ---------------- 关卡生成 ---------------- */
  function build(meta) {
    const R = rng(meta.seed);
    const d = meta.diff;
    const cols = meta.cols;
    const lv = Object.assign({}, meta, {
      width: cols * T, solids: [], enemies: [], items: [], pits: [],
    });

    /* --- 1. 地面分段 + 坑 --- */
    const segs = [];
    let x = 0, row = 11;
    let guard = 0;
    while (guard++ < 80) {
      const remain = cols - x;
      if (remain < 15) { segs.push({ a: x, b: cols - 1, r: row }); break; }

      const lenMin = Math.max(7, 14 - d);
      const lenMax = Math.min(remain - 6, 18 - Math.floor(d / 2));
      const len = ri(R, lenMin, Math.max(lenMin + 1, lenMax));
      segs.push({ a: x, b: x + len - 1, r: row });
      x += len;

      if (cols - x < 18) { segs.push({ a: x, b: cols - 1, r: row }); break; }

      // 坑的宽度
      let pw = d <= 2 ? ri(R, 2, 3) : (d >= 5 ? ri(R, 3, 4) : ri(R, 2, 3));
      // 4 格坑中间放一根石柱，保证一定能过
      if (pw === 4) lv.solids.push(solid(x + 2, row - 1, 1, 15 - row, false));
      lv.pits.push({ c0: x, c1: x + pw - 1, w: pw, r: row });
      x += pw;

      row = clamp(row + [(-1), 0, 0, 1, 1][ri(R, 0, 4)], 10, 12);
      if (row !== 11 && R() < 0.35) row = 11;
    }
    if (segs.length && segs[segs.length - 1].b < cols - 1) {
      segs.push({ a: segs[segs.length - 1].b + 1, b: cols - 1, r: 11 });
    }

    segs.forEach((s) => lv.solids.push(ground(s.a, s.b, s.r)));

    /* --- 2. 浮空平台（铃钱路线） --- */
    segs.forEach((s) => {
      const span = s.b - s.a + 1;
      if (span < 8) return;
      let px = s.a + 2 + ri(R, 0, 1);
      const end = s.b - 2;
      let g2 = 0;
      while (px + 3 <= end && g2++ < 9) {
        const w = Math.min(ri(R, 3, 4), end - px + 1);
        const rr = s.r - ri(R, 2, 3);
        if (rr < 3) break;
        lv.solids.push(plat(px, rr, w));
        for (let i = 0; i < w; i++) lv.items.push(bell(px + i, rr - 1));
        if (R() < 0.16 && w >= 3) lv.enemies.push(walker(px + 1, rr, px, px + w - 1));
        // 偶尔再来一层更高的平台
        if (d >= 2 && R() < 0.42 && rr - 2 >= 3 && px + w + 4 <= end) {
          const w2 = ri(R, 3, 4);
          const rr2 = rr - 2;
          lv.solids.push(plat(px + w + 1, rr2, Math.min(w2, end - (px + w + 1) + 1)));
          const ww = Math.min(w2, end - (px + w + 1) + 1);
          for (let i = 0; i < ww; i++) lv.items.push(bell(px + w + 1 + i, rr2 - 1));
          px += w + ww + ri(R, 3, 5);
        } else {
          px += w + ri(R, 2, 5);
        }
      }
    });

    /* --- 3. 空中的铃钱弧线 --- */
    segs.forEach((s) => {
      const span = s.b - s.a + 1;
      if (span < 12 || R() < 0.4) return;
      const c = s.a + ri(R, 3, Math.max(4, span - 7));
      const base = s.r - 3;
      const n = ri(R, 3, 5);
      for (let i = 0; i < n; i++) {
        const dy = Math.round(Math.sin((i / (n - 1)) * Math.PI) * 2) + ri(R, 0, 1);
        lv.items.push(bell(c + i, clamp(base - dy, 2, 9)));
      }
    });

    /* --- 4. 敌人 --- */
    segs.forEach((s, si) => {
      const span = s.b - s.a + 1;
      if (span < 8) return;
      let n = Math.floor(span / 11) + (d >= 3 ? 1 : 0);
      if (si === 0) n = Math.min(n, 1);
      for (let i = 0; i < n; i++) {
        const a = s.a + 3 + Math.floor(R() * Math.max(1, span - 6));
        if (si === 0 && a < 14) continue;
        const b = Math.min(s.b - 1, a + ri(R, 4, 7));
        if (b - a < 2) continue;
        lv.enemies.push(walker(a, s.r, a, b));
      }
    });

    // 飞行敌人：盘旋在坑的上方
    if (d >= 2) {
      lv.pits.forEach((p, i) => {
        if (p.w < 3 || i % 2 === 1) return;
        lv.enemies.push(flyer(p.c0 + 1, 8, p.c0 - 1, p.c0 + p.w + 1, 1.4, 0.75 + d * 0.09));
      });
    }

    /* --- 5. 移动平台（拿铃钱的捷径） --- */
    if (d >= 3) {
      lv.pits.forEach((p, i) => {
        if (p.w >= 3 && R() < 0.5 + d * 0.06) {
          lv.solids.push(mover(p.c0, 9, 2, 'x', p.w + 1, 34 + d * 5));
        }
        if (d >= 4 && R() < 0.3) {
          lv.solids.push(mover(p.c0 + 1, 6, 2, 'y', 3, 26 + d * 3));
        }
      });
    }

    /* --- 6. 水果（额外生命） --- */
    const bigSegs = segs.filter((s) => s.b - s.a >= 10);
    if (bigSegs.length) {
      const s1 = bigSegs[0];
      lv.items.push(fruit(s1.a + Math.floor((s1.b - s1.a) / 2), s1.r - 4));
      if (bigSegs.length > 1) {
        const s2 = bigSegs[bigSegs.length - 1];
        lv.items.push(fruit(s2.a + 4, s2.r - 3));
      }
    }

    /* --- 7. 出生点 / 检查点 / 终点 --- */
    lv.spawn = { x: 2 * T, y: (segs[0].r - 4) * T };

    const midCol = Math.floor(cols * 0.52);
    const cpSeg = segs.find((s) => midCol >= s.a && midCol <= s.b) || segs[Math.floor(segs.length / 2)];
    lv.checkpoint = { x: (cpSeg.a + 3) * T, y: cpSeg.r * T, on: false };

    const last = segs[segs.length - 1];
    lv.goal = { x: (last.b - 4) * T, y: last.r * T };

    // 终点 & 出生点附近清空敌人
    lv.enemies = lv.enemies.filter((e) => {
      const c = e.x / T;
      return c > 16 && c < cols - 12;
    });

    return lv;
  }

  const LEVELS = META.map(build);
  AC.LEVELS = LEVELS;
  AC.TILE = T;

  /* 渲染前的资源准备在 art.js / game.js 中完成 */
})();

</script>

  /* ---------------- 随机 ---------------- */

  /* =========================================================

  const VARIANTS = [
    { name: '小熊', fur: '#d09a62', fur2: '#b57e46', ear: 'round', shirt: '#8fd06a', shirt2: '#6fba4c', blush: '#f19aa8', kigar: '#5e4a34' },
